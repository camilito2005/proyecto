<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo Materialize</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    
</head>
<body>
    <nav>
        <div class="nav-wrapper">
            <a href="#" class="brand-logo">Logo</a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1 class="center-align">Bienvenido</h1>
        <div class="row">
            <div class="col s12 m6">
                <div class="card">
                    <div class="card-image">
                        <img src="imagen.jpg">
                        <span class="card-title">Título</span>
                    </div>
                    <div class="card-content">
                        <p>Este es un ejemplo de una tarjeta con Materialize.</p>
                    </div>
                    <div class="card-action">
                        <a href="#">Acción</a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Cargo</label>
        <select class="form-control" name="cargo_id">
            <option value="1" >ADMINISTRADOR</option>
            <option value="2" >EMPLEADO</option>
        </select>
    </div>



    <div class="mb-3">
        <label class="form-label">Cargo/Rol</label>
        <select class="form-select" name="cargo">
            <option value="1" {$cargo_id == 1 ? 'selected' : ''}>Administrador</option>
            <option value="2" {$cargo_id == 2 ? 'selected' : ''}>Empleado</option>
        </select>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
