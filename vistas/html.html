    <style>
        .tab-content .tab {

        }

        .tab-label {
            font-weight: bold;
            cursor: pointer;
            display: block;
            padding: 10px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .tab-content {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            display: none;
        }

        .tab input:checked + .tab-label + .tab-content {
            display: block;
        }
    </style>
</head>

<script>
    function Acordeon(params) {
        $(document).ready(function () {
        $('#enviar-id').click(function () {
            // Obtener el ID del div
            const idDiv = $('#acordeon').attr('id');

            // Enviar el ID por AJAX
            $.ajax({
                url: 'html.html', // Cambia esta URL por la de tu servidor
                type: 'POST',
                data: { id: idDiv },
                success: function (response) {
                    // Procesar la respuesta del servidor
                    console.log('Respuesta del servidor:', response);
                },
                error: function (xhr, status, error) {
                    console.error('Error en la solicitud:', error);
                }
            });
        });
    }); 
    }
    
</script>
